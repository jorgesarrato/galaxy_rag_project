name: Docker build and test

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t rag-api .

    - name: Run container and health check
      run: |
        docker run -d -p 8000:8000 --name rag_test \
          -e HF_TOKEN=test \
          -e DATA_DIR=data \
          -e DB_DIR=vectors \
          -e MODEL_DIR=llm_models \
          rag-api

        for i in {1..150}; do
          if curl -sf http://localhost:8000/health; then
            echo "API is ready"
            exit 0
          fi
          echo "Waiting for API... ($i/150)"
          sleep 4
        done

        echo "API did not become ready in time"
        docker logs rag_test
        exit 1

    - name: Stop container
      if: always()
      run: |
        docker stop rag_test || true
